<meta charset="utf-8">
<title>规则课情景</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">

<style>
:root{
  --bg:#F3F4EE; --bg2:#E8EBE1; --card:#FFFFFF;
  --ink:#1A2119; --ink2:#4B564A; --ink3:#7A8477; --line:#CBD1C1;
  --def:#1F5E36; --run:#C8553A; --clay:#B4573C;
  --fd:'Archivo','Noto Sans SC','PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  --fb:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:clamp(13px, 0.52vw + 0.78vh, 19px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);
  overflow:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2.5px solid var(--clay);outline-offset:2px}

#page{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{
  display:flex;align-items:center;gap:1.4rem;
  padding:1.1rem 2.2rem;border-bottom:1px solid var(--line);background:var(--card)
}
.brand{display:grid;gap:.15rem;margin-right:auto}
.brand b{font-family:var(--fd);font-weight:900;font-size:1.3rem;letter-spacing:-.01em}
.brand small{font-family:var(--fd);font-size:.7rem;font-weight:700;letter-spacing:.2em;color:var(--clay)}
.hkeys{font-family:var(--fd);font-size:.74rem;color:var(--ink3);letter-spacing:.04em}
.hkeys kbd{font-family:var(--fd);font-size:.72rem;border:1px solid var(--line);border-radius:3px;
  padding:.05rem .38rem;background:var(--bg);color:var(--ink2);margin:0 .2rem}

main{display:grid;grid-template-columns:31rem minmax(0,1fr);min-height:0}

aside{
  border-right:1px solid var(--line);background:var(--bg2);min-height:0;
  display:flex;flex-direction:column
}
[hidden]{display:none!important}
.sit{padding:1.4rem 1.6rem .9rem;flex:0 0 auto}
.sit .no{font-family:var(--fd);font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--clay)}
.sit h2{font-family:var(--fd);font-weight:900;font-size:1.75rem;line-height:1.2;margin:.25rem 0 .6rem;letter-spacing:-.015em}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.sitnav{display:flex;align-items:center;gap:.4rem}
.sitnav .no{margin-right:auto}
.sitnav .btn{padding:.3rem .65rem;font-size:.74rem}
.chips span{font-family:var(--fd);font-size:.8rem;font-weight:700;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:.18rem .7rem;color:var(--ink2)}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:0 1.6rem .9rem;flex:0 0 auto}
.tab{
  font-family:var(--fb);font-size:1rem;font-weight:700;padding:.7rem .6rem;
  border:2px solid var(--line);background:var(--card);color:var(--ink2);border-radius:4px;cursor:pointer
}
.tab:hover{border-color:var(--ink3);color:var(--ink)}
.tab[data-v="def"][aria-pressed="true"]{background:var(--def);border-color:var(--def);color:#FFFFFF}
.tab[data-v="run"][aria-pressed="true"]{background:var(--run);border-color:var(--run);color:#FFFFFF}

.steps{list-style:none;margin:0;padding:.2rem 1.6rem 1rem;overflow:auto;flex:1 1 auto;min-height:0;
  display:flex;flex-direction:column;gap:.5rem;counter-reset:st;border-top:1px solid var(--line);padding-top:.9rem}
.steps li{
  counter-increment:st;position:relative;
  padding:.8rem 1rem .85rem 3.1rem;border-left:4px solid transparent;border-radius:0 4px 4px 0;
  transition:opacity .35s ease,background .25s ease,border-color .25s ease,color .25s ease
}
.steps li::before{
  content:counter(st);position:absolute;left:.9rem;top:.85rem;
  width:1.55rem;height:1.55rem;border-radius:50%;display:grid;place-items:center;
  font-family:var(--fd);font-weight:900;font-size:.82rem;background:var(--line);color:var(--ink2)
}
.steps li b{display:block;font-family:var(--fd);font-weight:900;font-size:1.22rem;line-height:1.3}
.steps li p{margin:.3rem 0 0;font-size:.98rem;line-height:1.65;color:var(--ink2)}
.steps li p em{font-style:normal;font-weight:700;color:var(--ink)}
.steps li.future{opacity:0;visibility:hidden}
.steps li.past{color:var(--ink3)}
.steps li.past p,.steps li.past p em{color:var(--ink3)}
.steps li.cur{background:var(--card)}
aside[data-v="def"] .steps li.cur{border-left-color:var(--def)}
aside[data-v="run"] .steps li.cur{border-left-color:var(--run)}
aside[data-v="def"] .steps li.cur::before{background:var(--def);color:#FFFFFF}
aside[data-v="run"] .steps li.cur::before{background:var(--run);color:#FFFFFF}

.ctrl{display:flex;align-items:center;gap:.5rem;padding:1rem 1.6rem;border-top:1px solid var(--line);background:var(--bg2);flex:0 0 auto}
.ctrl .ct{font-family:var(--fd);font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink2);margin-right:auto;font-size:.92rem}
.btn{
  font-family:var(--fd);font-size:.8rem;font-weight:700;letter-spacing:.04em;
  background:var(--card);color:var(--ink2);border:1px solid var(--line);
  padding:.48rem .95rem;border-radius:2px;cursor:pointer;white-space:nowrap
}
.btn:hover{color:var(--ink);border-color:var(--ink3)}
.btn.primary{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

#stage{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;padding:1rem 2rem 1.2rem;gap:.6rem}
#svgbox{min-height:0;display:grid;place-items:center}
svg#dia{height:100%;width:auto;max-width:100%;display:block}
.cap{
  text-align:center;font-family:var(--fd);font-weight:900;font-size:1.65rem;line-height:1.35;
  min-height:2.3em;display:grid;place-items:center;color:var(--ink);
  opacity:0;transform:translateY(.35rem);transition:opacity .35s ease,transform .35s ease
}
.cap.in{opacity:1;transform:none}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem 1.5rem;font-size:.86rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:.45rem}
.legend i{width:.8rem;height:.8rem;border-radius:50%;display:inline-block;border:2px solid #FFFFFF;box-shadow:0 0 0 1px var(--line)}
.legend u{display:inline-block;width:1.6rem;height:0;border-top:4px solid #C4302B;text-decoration:none}
.legend u.no{border-top:3px dashed #7A8477}
.legend b{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;border:3px solid #D4E03A}

.sb{font-family:var(--fd);font-weight:800}
.lbl{font-family:var(--fb);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.fx{transition:opacity .45s ease}

@media (max-width:1000px){
  body{overflow:auto}
  #page{height:auto;min-height:100%}
  main{grid-template-columns:minmax(0,1fr)}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  #stage{min-height:70vh}
  svg#dia{height:auto;width:100%}
  .hkeys{display:none}
}
@media (prefers-reduced-motion:reduce){
  .steps li,.cap,.fx{transition:none}
}

/* 点一下播一段 */
#svgbox{position:relative}
#svgbox.wait{cursor:pointer}
.cue{position:absolute;right:.6rem;bottom:.6rem;font-family:var(--fd);font-size:.82rem;font-weight:700;
  background:#C8553A;color:#FFFFFF;border-radius:99px;padding:.35rem .9rem;opacity:0;pointer-events:none;
  transition:opacity .3s ease}
.cue.on{opacity:1;animation:cuePulse 1.6s ease-in-out infinite}
@keyframes cuePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.btn.play{background:#C8553A!important;border-color:#C8553A!important;color:#FFFFFF!important}
@media (prefers-reduced-motion:reduce){.cue.on{animation:none}}

.note{display:none;margin:.55rem 0 0;font-size:.85rem;line-height:1.6;color:#B4573C;
  border-left:3px solid #B4573C;padding-left:.7rem;font-weight:500}
#page.notes .note{display:block}
.btn.on,.tg.on{background:#B4573C!important;border-color:#B4573C!important;color:#FFFFFF!important}

/* 考验模式 */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-bottom:.7rem}
.mode{font-family:var(--fd);font-size:.82rem;font-weight:700;padding:.45rem;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:3px}
.mode[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
#quiz{padding:.9rem 1.6rem 1rem;overflow:auto;border-top:1px solid var(--line);flex:1 1 auto;min-height:0}
#quiz section{margin-bottom:.9rem}
#quiz h3{font-family:var(--fd);font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--ink3);margin:0 0 .45rem}
.qhint{font-size:.82rem;color:var(--ink3);line-height:1.55;margin:.3rem 0 .4rem}
.qline{font-family:var(--fd);font-weight:800;font-size:1.02rem;background:var(--card);
  border:1px solid var(--line);border-radius:3px;padding:.5rem .7rem}
.qbtns{display:flex;flex-wrap:wrap;gap:.4rem}
.qb{font-family:var(--fb);font-size:.9rem;font-weight:700;padding:.45rem .8rem;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:3px}
.qb:hover{border-color:var(--ink3);color:var(--ink)}
.qb[aria-pressed="true"]{background:var(--def);border-color:var(--def);color:#FFFFFF}
.qb.bad[aria-pressed="true"]{background:#C4302B;border-color:#C4302B}
.btn.wide{width:100%;text-align:center}
.rrow{display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem;font-size:.9rem}
.rrow b{font-family:var(--fd);width:3.4rem;color:var(--ink)}
.qres{font-size:.98rem;line-height:1.7;color:var(--ink);margin:0}
.qstd{font-size:.92rem;line-height:1.65;color:#B4573C;border-left:3px solid #B4573C;padding-left:.7rem;margin:.6rem 0 0}
.qhit{pointer-events:none;fill:transparent;transition:fill .15s}
svg.pick .qhit{pointer-events:all;cursor:pointer;fill:rgba(212,224,58,.16)}
svg.pick .qhit:hover{fill:rgba(212,224,58,.42)}
svg.pick #fielders g{cursor:crosshair}
svg.pick #fielders g circle{stroke:#C2601A;stroke-width:3.5}
</style>

<div id="page">
<header>
  <div class="brand">
    <small>板块四 · 情景</small>
    <b>情景讲解：同一球，两边怎么做</b>
  </div>
  <div class="hkeys"><kbd>→</kbd>播放 / 下一步<kbd>←</kbd>上一步<kbd>R</kbd>重播<kbd>Tab</kbd>切换视角</div>
</header>

<main>
  <aside id="aside" data-v="def">
    <div class="sit">
      <div class="modes">
        <button class="mode" id="mTeach" aria-pressed="true">讲解模式</button>
        <button class="mode" id="mQuiz" aria-pressed="false">考验模式</button>
      </div>
      <div class="sitnav"><div class="no" id="sitNo"></div><button class="btn" id="sPrev">‹ 上一个</button><button class="btn" id="sNext">下一个 ›</button></div>
      <h2 id="sitTitle"></h2>
      <div class="chips" id="sitChips"></div>
      <p class="note" id="sitNote"></p>
    </div>
    <div class="tabs">
      <button class="tab" data-v="def" aria-pressed="true">守备方怎么处理</button>
      <button class="tab" data-v="run" aria-pressed="false">跑垒员怎么处理</button>
    </div>
    <ol class="steps" id="steps"></ol>
    <div id="quiz" hidden>
      <section>
        <h3>一、摆局面</h3>
        <p class="qhint">局面板上发亮的圆圈可以点：点垒包加减跑者，点出局灯切换零到两出局。</p>
        <div class="qline" id="qState">垒上没人 · 零出局</div>
      </section>
      <section>
        <h3>二、这一球打成什么</h3>
        <div class="qbtns" id="qTypes">
          <button class="qb" data-t="滚地球">滚地球</button>
          <button class="qb" data-t="平飞球">平飞球</button>
          <button class="qb" data-t="高飞球">高飞球</button>
        </div>
        <p class="qhint">再点场上任意一名防守球员，决定球打到谁那里。</p>
        <div class="qline" id="qBall">还没选</div>
      </section>
      <section id="qGo">
        <button class="btn primary wide" id="bPlay">开始这一球</button>
      </section>
      <section id="qChoice" hidden>
        <h3>三、守备怎么处理</h3>
        <div class="qbtns" id="qThrow"></div>
        <h3 style="margin-top:.8rem">四、跑者怎么跑</h3>
        <div id="qRunners"></div>
        <button class="btn primary wide" id="bResolve" style="margin-top:.7rem">看结果</button>
      </section>
      <section id="qResult" hidden>
        <h3>结果</h3>
        <p class="qres" id="qResText"></p>
        <p class="qstd" id="qStdText" hidden></p>
        <div class="qbtns">
          <button class="btn" id="bStd">看标准处理</button>
          <button class="btn primary" id="bNextBall">下一球</button>
        </div>
      </section>
    </div>
    <div class="ctrl">
      <span class="ct" id="ct"></span>
      <button class="btn" id="bNote">讲解提示</button>
      <button class="btn" id="bPrev">上一步</button>
      <button class="btn" id="bReplay">重播</button>
      <button class="btn primary" id="bNext">下一步</button>
    </div>
  </aside>

  <div id="stage">
    <div id="svgbox">
      <svg id="dia" viewBox="0 0 640 610" role="img" aria-label="局面板和简化球场，演示情景中守备方和跑垒员的处理">
        <defs>
          <marker id="mRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#C4302B"/>
          </marker>
          <marker id="mGrey" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 Z" fill="#7A8477"/>
          </marker>
        </defs>

        <!-- 局面板 -->
        <rect x="20" y="16" width="600" height="138" rx="6" fill="#1A2119"/>
        <text x="40" y="42" class="sb" font-size="13" fill="#D4E03A">局面</text>
        <text x="130" y="42" class="sb" font-size="13" fill="#7A8477" text-anchor="middle">垒上有谁</text>
        <text x="330" y="42" class="sb" font-size="13" fill="#7A8477" text-anchor="middle">几出局</text>
        <text x="510" y="42" class="sb" font-size="13" fill="#7A8477" text-anchor="middle">什么球</text>
        <line x1="230" y1="30" x2="230" y2="142" stroke="#3A4238"/>

        <circle class="qhit" data-b="2" cx="130" cy="70" r="19" fill="transparent"/>
        <rect id="mb3" x="87" y="95" width="18" height="18" fill="#3A4238" stroke="#7A8477" transform="rotate(45 96 104)"/>
        <circle class="qhit" data-b="3" cx="96" cy="104" r="19" fill="transparent"/>

        <text id="bt" x="510" y="104" class="sb" font-size="17" fill="#E8EBE1" text-anchor="middle">—</text>

        <!-- 注意事项标注 -->

          <circle cx="334" cy="294" r="40" fill="none" stroke="#C4302B" stroke-width="3" stroke-dasharray="7 5"/>
          <text x="382" y="346" class="lbl" font-size="16" fill="#C4302B">不滑垒、不撞人</text>
        </g>
        <g id="noteWhite" class="fx" opacity="0">
          <line x1="451" y1="409" x2="444" y2="378" stroke="#1A2119" stroke-width="1.5"/>

        <g id="bat" class="fx" opacity="0"><circle class="halo fx" r="22" fill="none" stroke="#D4E03A" stroke-width="4" opacity="0"/><circle r="13" fill="#C8553A" stroke="#FFFFFF" stroke-width="2.5"/></g>
        <g id="ball" class="fx" opacity="0"><circle r="7" fill="#D4E03A" stroke="#5E6A00" stroke-width="1.5"/></g>
        <g id="badge1" class="fx" opacity="0">
          <rect x="-30" y="-16" width="60" height="32" rx="16" fill="#C4302B" stroke="#FFFFFF" stroke-width="2.5"/>
          <text y="6" class="sb" font-size="16" fill="#FFFFFF" text-anchor="middle">出局</text>
        </g>
        <g id="badge2" class="fx" opacity="0">
          <rect x="-30" y="-16" width="60" height="32" rx="16" fill="#C4302B" stroke="#FFFFFF" stroke-width="2.5"/>
          <text y="6" class="sb" font-size="16" fill="#FFFFFF" text-anchor="middle">出局</text>
        </g>
      </svg>
      <div class="cue" id="cue">▶ 点一下继续</div>
    </div>

<script>
(function(){

  /* ---------- 工具 ---------- */
  function place(el,x,y){ el._x=x; el._y=y; el.setAttribute('transform','translate('+x+','+y+')'); }

  function bases(list){ for(var k=1;k<=3;k++) $('mb'+k).setAttribute('fill', list.indexOf(k)>=0 ? '#C8553A' : '#3A4238'); }
  function halo(ids){
    Array.prototype.forEach.call(document.querySelectorAll('.halo'),function(h){ h.setAttribute('opacity',0); });
    (ids||[]).forEach(function(id){ var h=$(id).querySelector('.halo'); if(h) h.setAttribute('opacity',1); });

  function badge(n,p,text,good){
    var b=$('badge'+n);

  function tween(el,pts,dur,id){
    return new Promise(function(res){
      var last=pts[pts.length-1];
      if(RM||!dur){ place(el,last[0],last[1]); res(); return; }
      var path=[[el._x,el._y]].concat(pts), lens=[], tot=0;
      for(var i=1;i<path.length;i++){ var d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]); lens.push(d); tot+=d; }
      var t0=null;
      function f(ts){
        if(id!==runId){ res(); return; }
        if(t0===null) t0=ts;
        var k=Math.min(1,(ts-t0)/(dur*SLOW)), dist=k*tot, j=0;
        while(j<lens.length-1 && dist>lens[j]){ dist-=lens[j]; j++; }
        var a=path[j], b=path[j+1], u=lens[j]?Math.min(1,dist/lens[j]):1;
        place(el,a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u);
        if(k<1) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(f);
    });
  }
  function arc(el,to,h,dur,id){
    var x0=el._x, y0=el._y, x1=to[0], y1=to[1], cx=(x0+x1)/2, cy=Math.min(y0,y1)-h;
    return new Promise(function(res){
      if(RM){ place(el,x1,y1); res(); return; }
      var t0=null;
      function f(ts){
        if(id!==runId){ res(); return; }
        if(t0===null) t0=ts;
        var k=Math.min(1,(ts-t0)/(dur*SLOW)), u=1-k;
        place(el, u*u*x0+2*u*k*cx+k*k*x1, u*u*y0+2*u*k*cy+k*k*y1);
        if(k<1) requestAnimationFrame(f); else res();
      }
      requestAnimationFrame(f);
    });
  }
  function ringAt(p,id){
    var r=$('ring'); r.setAttribute('cx',p[0]); r.setAttribute('cy',p[1]);
    if(RM) return Promise.resolve();
    return new Promise(function(res){
      var t0=null;
      function f(ts){
        if(id!==runId){ r.setAttribute('opacity',0); res(); return; }
        if(t0===null) t0=ts;
        var k=Math.min(1,(ts-t0)/(650*SLOW));

  function later(ms,id,fn){ return (async function(){ await sleep(ms); if(id!==runId) return; await fn(); })(); }
  function arrow(from,to,notForced){
    var a=BASE[from], b=BASE[to];

  /* ---------- 情景一的动作片段 ---------- */
  /* 滚地球到游击手，传二垒封杀一垒跑者 */

  var AFTER2={bases:[1],ball:'滚地球',r1:[345,305],bat:[389,480],ballAt:COVER2,f:{f2:COVER2,f1:COVER1}};

  /* ---------- 考验模式 ---------- */
  var BAG={0:HOME,1:B1,2:B2,3:B3,4:HP};
  var ZONES=[
    {k:'fS',n:'游击手'},{k:'f3',n:'三垒手'},{k:'f1',n:'一垒手'},{k:'f2',n:'二垒手'},
    {k:'fP',n:'投手'},{k:'fL',n:'左外野'},{k:'fCF',n:'中外野'},{k:'fR',n:'右外野'},{k:'fX',n:'自由人'}
  ];
  var RUN_SPD=6.0, THROW_SPD=25, GRND_SPD=18, LINER_SPD=28, SEC=520;
  function mOf(px){ return px/10; }
  function dist(a,b){ return Math.hypot(a[0]-b[0],a[1]-b[1]); }
  function fieldTime(z,type){
    var d=mOf(dist(HOME,z));
    if(type==='滚地球') return d/GRND_SPD+0.55;
    if(type==='平飞球') return d/LINER_SPD+0.3;
    return 3.2;
  }
  function runTime(a,b){ return mOf(dist(a,b))/RUN_SPD+0.25; }
  function throwTime(a,b){ return mOf(dist(a,b))/THROW_SPD+0.55; }
  var CN={1:'一垒',2:'二垒',3:'三垒',4:'本垒'};

  var Q={on:false, bases:{1:false,2:false,3:false}, outs:0, type:null, zone:null,
         throws:[], acts:{}, phase:'setup'};

  function qState(){
    var on=[1,2,3].filter(function(k){ return Q.bases[k]; });
    $('qState').textContent=(on.length? on.map(function(k){return CN[k];}).join('、')+'有人' : '垒上没人')+' · '+['零','一','两'][Q.outs]+'出局';
    bases(on); outs(Q.outs);
    setState({bases:on, outs:Q.outs, ball:Q.type,
      r1:Q.bases[1]?B1:null, r2:Q.bases[2]?B2:null, r3:Q.bases[3]?B3:null, bat:HOME});
    $('qBall').textContent = (Q.type&&Q.zone)? (Q.type+' → '+Q.zone.n) : (Q.type? Q.type+'，还没选落点' : '还没选');
  }
  function qPickable(on){
    Array.prototype.forEach.call(document.querySelectorAll('.qhit'),function(h){
      h.setAttribute('fill', on ? 'rgba(212,224,58,0.20)' : 'transparent');
    });
  }
  function qForced(k){ for(var i=1;i<k;i++){ if(!Q.bases[i]) return false; } return true; }

  function qReset(keep){
    Q.type=null; Q.zone=null; Q.throws=[]; Q.acts={}; Q.phase='setup';
    if(!keep){ Q.bases={1:false,2:false,3:false}; Q.outs=0; }
    Array.prototype.forEach.call(document.querySelectorAll('#qTypes .qb'),function(b){ b.setAttribute('aria-pressed','false'); });
    $('qChoice').hidden=true; $('qResult').hidden=true; $('qGo').hidden=false;
    $('qStdText').hidden=true;
    svg.classList.toggle('pick', Q.on);
    qPickable(Q.on);
    qState();
    say('摆好局面，选球型和落点，再点开始');
  }

  function qBuildChoices(caught){
    var tw=$('qThrow'); tw.innerHTML='';
    [[1,'传一垒'],[2,'传二垒'],[3,'传三垒'],[4,'传本垒'],[0,'持球不传'],[-1,'传偏']].forEach(function(o){
      var b=document.createElement('button');
      b.className='qb'+(o[0]===-1?' bad':''); b.textContent=o[1]; b.dataset.base=o[0];
      b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){
        Array.prototype.forEach.call(tw.children,function(c){ c.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true'); Q.throws=[o[0]];
      });
      tw.appendChild(b);
    });
    var rw=$('qRunners'); rw.innerHTML='';
    var list=[];
    [3,2,1].forEach(function(k){ if(Q.bases[k]) list.push({id:k, label:CN[k]+'跑者'}); });
    if(!caught) list.push({id:0, label:'打者'});
    if(!list.length){ rw.innerHTML='<p class="qhint">这一球没有跑者要决定。</p>'; return; }
    list.forEach(function(r){
      var row=document.createElement('div'); row.className='rrow';
      var b=document.createElement('b'); b.textContent=r.label; row.appendChild(b);
      [['go','跑'],['stay','不跑']].forEach(function(o){
        var btn=document.createElement('button');
        btn.className='qb'; btn.textContent=o[1]; btn.setAttribute('aria-pressed', String(o[0]==='go' && (r.id===0 || qForced(r.id))));
        btn.addEventListener('click',function(){
          Array.prototype.forEach.call(row.querySelectorAll('.qb'),function(c){ c.setAttribute('aria-pressed','false'); });
          btn.setAttribute('aria-pressed','true'); Q.acts[r.id]=o[0];
        });
        row.appendChild(btn);
      });
      Q.acts[r.id]=(r.id===0 || qForced(r.id))?'go':'stay';
      rw.appendChild(row);
    });
    if(caught){
      var tip=document.createElement('p'); tip.className='qhint';
      tip.textContent='球被接住了：选「跑」表示补踩之后再跑。';
      rw.appendChild(tip);
    }
  }

  async function qPlay(){
    if(!Q.type || !Q.zone){ say('先选球型，再点场上一名防守球员'); return; }
    var id=++runId;
    Q.phase='play';
    $('qGo').hidden=true; svg.classList.remove('pick'); qPickable(false);
    var z=FPOS[Q.zone.k];
    var caught=(Q.type!=='滚地球');
    say('打出'+Q.type+'，飞向'+Q.zone.n);
    if(caught){
      await arcBall(id,z,Q.type==='高飞球'?240:60,fieldTime(z,Q.type)*SEC); if(id!==runId) return;
      ringAt(z,id);
      Q.outs=Math.min(3,Q.outs+1); outs(Q.outs);
      badge(1,[z[0]+70,z[1]-30],'出局');
      say('球被接住：打者出局');
    } else {
      show(ball,true); place(ball,HOME[0],HOME[1]-6);
      await tween(ball,[z],fieldTime(z,Q.type)*SEC,id); if(id!==runId) return;
      ringAt(z,id);
      say('球到了'+Q.zone.n+'手里');
    }
    Q.caught=caught;
    qBuildChoices(caught);
    $('qChoice').hidden=false;
    Q.phase='choose';
  }
  function arcBall(id,to,h,dur){ show(ball,true); place(ball,HOME[0],HOME[1]-6); return arc(ball,to,h,dur,id); }

  async function qResolve(){
    if(Q.phase!=='choose') return;
    var id=++runId;
    Q.phase='resolve';
    $('qChoice').hidden=true;
    var z=FPOS[Q.zone.k], tField=fieldTime(z,Q.type);
    var target=Q.throws.length?Q.throws[0]:0;
    var lines=[], scored=0;

    /* 跑者的目标与到达时间 */
    var movers=[];
    [3,2,1].forEach(function(k){
      if(!Q.bases[k]) return;
      var go=(Q.acts[k]==='go');
      if(!go) return;
      var from=BAG[k], to=BAG[k+1];
      var start=Q.caught? tField : 0;
      movers.push({id:k, from:from, to:to, base:k+1, t:start+runTime(from,to), forced:(!Q.caught && qForced(k)), el:R(k)});
    });
    if(!Q.caught && Q.acts[0]==='go'){
      movers.push({id:0, from:HOME, to:B1, base:1, t:runTime(HOME,B1), forced:true, el:bat});
    }

    /* 传球到达时间 */
    var tArrive=null, wide=false;
    if(target===-1){ wide=true; tArrive=tField+0.2+throwTime(z,BAG[1])+1.6; }
    else if(target>0){ tArrive=tField+0.2+throwTime(z,BAG[target]); }

    /* 动画 */
    var anims=movers.map(function(mv){
      return (async function(){
        await sleep((Q.caught?tField:0)*SEC*0.6); if(id!==runId) return;
        await tween(mv.el,[mv.to],runTime(mv.from,mv.to)*SEC,id);
      })();
    });
    if(target===-1){
      await tween(ball,[[560,470],[610,520]],(throwTime(z,BAG[1])+0.9)*SEC,id); if(id!==runId) return;
      say('传偏了，球滚到界外');
    } else if(target>0){
      await sleep(200); if(id!==runId) return;
      await tween(ball,[BAG[target]],throwTime(z,BAG[target])*SEC,id); if(id!==runId) return;
      ringAt(BAG[target],id);
    } else {
      say('持球不传');
    }
    await Promise.all(anims); if(id!==runId) return;

    /* 判定 */
    var newBases={1:false,2:false,3:false};
    [1,2,3].forEach(function(k){ if(Q.bases[k] && Q.acts[k]!=='go') newBases[k]=true; });
    var outsAdded=0;
    movers.forEach(function(mv){
      var out=false;
      if(!wide && target===mv.base){
        if(mv.forced) out=(tArrive < mv.t);
        else out=(tArrive+0.35 < mv.t);
      }
      if(out){
        outsAdded++;
        lines.push((mv.id===0?'打者':CN[mv.id]+'跑者')+'在'+CN[mv.base]+'出局');
        badge(outsAdded===1?1:2,[BAG[mv.base][0]+60,BAG[mv.base][1]-36],'出局');
      } else {
        if(mv.base===4){ scored++; lines.push((mv.id===0?'打者':CN[mv.id]+'跑者')+'跑回本垒'); }
        else { newBases[mv.base]=true; lines.push((mv.id===0?'打者':CN[mv.id]+'跑者')+'安全上'+CN[mv.base]); }
      }
    });
    if(Q.caught && target>0 && !wide){
      /* 未跑的跑者不受影响 */
    }
    Q.outs=Math.min(3,Q.outs+outsAdded);
    outs(Q.outs);

    /* 得分是否算：三出局且由封杀造成则不算 */
    var noteScore='';
    if(scored>0 && Q.outs>=3){
      var forcedThird=movers.some(function(mv){ return mv.forced && target===mv.base && tArrive<mv.t; });
      if(forcedThird){ scored=0; noteScore='第三个出局是封杀，这一分不算。'; }
    }
    Q.bases=newBases;
    var summary=lines.join('；')+'。'+(scored?('得 '+scored+' 分。'):'')+noteScore;
    $('qResText').textContent=summary+' 现在 '+['零','一','两','三'][Q.outs]+'出局。';
    $('qResult').hidden=false;
    say(outsAdded? '出局 '+outsAdded+' 人' : (scored?'得分':'全部安全'));
    if(Q.outs>=3){ $('qResText').textContent+=' 三人出局，换边。'; }
    $('qStdText').textContent=qAdvice();
    var onNow=[1,2,3].filter(function(k){ return Q.bases[k]; });
    $('qState').textContent=(onNow.length? onNow.map(function(k){return CN[k];}).join('、')+'有人' : '垒上没人')+' · '+['零','一','两','三'][Q.outs]+'出局';
    Q.phase='done';
  }

  function qAdvice(){
    var on=[1,2,3].filter(function(k){ return Q.basesBefore[k]; });
    if(Q.caught) return '建议：球被接住，先看有没有跑者提前离垒，把球传回那个垒；没有的话，直接把球传回内场。';
    var forcedBases=[];
    if(true) forcedBases.push(1);
    [1,2,3].forEach(function(k){ if(Q.basesBefore[k] && forcedBases.indexOf(k)>=0){} });
    var lead=0;
    for(var k=3;k>=1;k--){
      if(Q.basesBefore[k]){
        var f=true;
        for(var i=1;i<k;i++){ if(!Q.basesBefore[i]) f=false; }
        if(f){ lead=k+1; break; }
      }
    }
    if(lead) return '建议：先传'+CN[lead]+'，封杀领先的跑者；来得及再转传一垒。有封杀机会时，先拿离得分最近的那个。';
    return '建议：传一垒拿下打者。垒上的跑者不被迫，要拿他必须拿球碰到他，硬传容易失误。';
  }

  function qSetMode(on){
    Q.on=on;
    $('mTeach').setAttribute('aria-pressed',String(!on));
    $('mQuiz').setAttribute('aria-pressed',String(on));
    $('quiz').hidden=!on;
    $('steps').hidden=on;
    document.querySelector('.tabs').hidden=on;
    document.querySelector('.ctrl').hidden=on;
    document.querySelector('.sitnav').hidden=on;
    $('sitTitle').textContent= on? '自己摆一个局面' : SITS[sitIdx].title;
    $('sitNo').textContent= on? '考验模式' : ('情景 '+SITS[sitIdx].no+' / 13');
    $('sitChips').innerHTML= on? '' : SITS[sitIdx].chips.map(function(c){ return '<span>'+c+'</span>'; }).join('');
    $('sitNote').textContent= on? '让新人先说该怎么处理，你照他说的点，再看结果。' : (SITS[sitIdx].n||'');
    runId++;
    if(on){ svg.classList.add('pick'); qReset(false); }
    else { svg.classList.remove('pick'); setView(view); }
  }

  Array.prototype.forEach.call(document.querySelectorAll('.qhit'),function(h){
    h.addEventListener('click',function(){
      if(!Q.on || Q.phase!=='setup') return;
      if(h.dataset.b){ var k=+h.dataset.b; Q.bases[k]=!Q.bases[k]; }
      else { Q.outs=(Q.outs+1)%3; }
      qState();
    });
  });

  /* 点场上的人选落点；点局面板改局面 */
  ZONES.forEach(function(z){
    var el=$(z.k);
    if(!el) return;
    el.style.pointerEvents='all';
    el.addEventListener('click',function(){
      if(!Q.on || Q.phase!=='setup') return;
      Q.zone=z; qState(); say('落点：'+z.n);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#qTypes .qb'),function(b){
    b.addEventListener('click',function(){
      if(Q.phase!=='setup') return;
      Array.prototype.forEach.call(document.querySelectorAll('#qTypes .qb'),function(c){ c.setAttribute('aria-pressed','false'); });
      b.setAttribute('aria-pressed','true'); Q.type=b.dataset.t; qState();

  $('mTeach').addEventListener('click',function(){ qSetMode(false); });
  $('mQuiz').addEventListener('click',function(){ qSetMode(true); });
  $('bPlay').addEventListener('click',function(){ Q.basesBefore={1:Q.bases[1],2:Q.bases[2],3:Q.bases[3]}; qPlay(); });
  $('bResolve').addEventListener('click',qResolve);
  $('bStd').addEventListener('click',function(){ $('qStdText').hidden=!$('qStdText').hidden; });
  $('bNextBall').addEventListener('click',function(){
    if(Q.outs>=3){ Q.outs=0; Q.bases={1:false,2:false,3:false}; }
    qReset(true);
  });

  /* ---------- 界面：点一下播一段 ---------- */
  var sitIdx=0, view='def', cur=0, lis=[], pending=null, done=false;
  function steps(){ return SITS[sitIdx].views[view]; }
  function setSit(i){
    sitIdx=Math.max(0,Math.min(SITS.length-1,i));
    var S=SITS[sitIdx];
    $('sitNo').textContent='情景 '+S.no+' / 13';
    $('sitTitle').textContent=S.title;
    $('sitChips').innerHTML=S.chips.map(function(c){ return '<span>'+c+'</span>'; }).join('');
    $('sitNote').textContent=S.n||'';
    $('sPrev').disabled=(sitIdx===0);
    $('sNext').disabled=(sitIdx===SITS.length-1);
    setView('def');
  }
  function beat(id){
    return new Promise(function(res){
      if(id!==runId){ res(); return; }
      pending={res:res}; syncBtn();
    });
  }
  function syncBtn(){
    var b=$('bNext'), last=(cur===steps().length-1);
    b.classList.toggle('play', !!pending);
    if(pending){ b.textContent='▶ 播放'; b.disabled=false; }
    else if(done){ b.textContent='下一步'; b.disabled=last; }
    else { b.textContent='播放中…'; b.disabled=true; }
    $('cue').classList.toggle('on', !!pending);
    $('svgbox').classList.toggle('wait', !!pending);
  }
  function next(){
    if(pending){ var p=pending; pending=null; syncBtn(); p.res(); }
    else if(done && cur<steps().length-1){ go(cur+1); }
  }
  function buildSteps(){
    var ol=$('steps'); ol.innerHTML='';
    steps().forEach(function(st,i){
      var li=document.createElement('li');
      li.innerHTML='<b>'+st.t+'</b><p>'+st.b+'</p>';
      li.addEventListener('click',function(){ if(i<=cur) go(i); });
      ol.appendChild(li);
    });
    lis=Array.prototype.slice.call(ol.children);
  }
  function setView(v){
    view=v;
    $('aside').setAttribute('data-v',v);
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){ t.setAttribute('aria-pressed',String(t.dataset.v===v)); });
    buildSteps(); go(0);
  }
  function go(n){
    var list=steps();
    cur=Math.max(0,Math.min(list.length-1,n));
    lis.forEach(function(li,i){
      li.classList.toggle('future', i>cur);
      li.classList.toggle('past', i<cur);
      li.classList.toggle('cur', i===cur);
    });
    lis[cur].scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
    $('ct').textContent=(cur+1)+' / '+list.length;
    $('bPrev').disabled=(cur===0);
    runId++; var id=runId;
    if(pending){ var old=pending; pending=null; old.res(); }
    done=false; syncBtn();
    Promise.resolve(list[cur].run(id)).then(function(){ if(id===runId){ done=true; pending=null; syncBtn(); } });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){ setView(t.dataset.v); });
  });
  $('sPrev').addEventListener('click',function(){ setSit(sitIdx-1); });
  $('sNext').addEventListener('click',function(){ setSit(sitIdx+1); });
  $('bNext').addEventListener('click',next);
  $('bPrev').addEventListener('click',function(){ go(cur-1); });
  $('bReplay').addEventListener('click',function(){ go(cur); });
  $('svgbox').addEventListener('click',function(){ if(pending) next(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
    else if(e.key==='r'||e.key==='R'){ go(cur); }
    else if(e.key==='Tab'){ e.preventDefault(); setView(view==='def'?'run':'def'); }
  });


  var __np=$('page');
  $('bNote').addEventListener('click',function(){
    var on=__np.classList.toggle('notes');
    this.classList.toggle('on', on);
  });
  setSit(0);
})();
</script>
